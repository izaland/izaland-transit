<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Station Inspector — Izarail Debug</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; color: #eee; font-family: monospace; padding: 24px; }
    h1 { font-size: 1.1rem; color: #aaa; margin-bottom: 20px; letter-spacing: 0.05em; }
    #search-bar { display: flex; gap: 8px; margin-bottom: 24px; }
    #query { flex: 1; background: #222; border: 1px solid #444; color: #eee;
             padding: 10px 14px; font-size: 1rem; font-family: monospace; border-radius: 4px; }
    #query:focus { outline: none; border-color: #888; }
    button { background: #333; color: #eee; border: 1px solid #555; padding: 10px 18px;
             font-family: monospace; font-size: 0.9rem; border-radius: 4px; cursor: pointer; }
    button:hover { background: #444; }
    #suggestions { background: #1a1a1a; border: 1px solid #333; border-radius: 4px;
                   margin-bottom: 20px; max-height: 200px; overflow-y: auto; display: none; }
    .sug-item { padding: 8px 14px; cursor: pointer; font-size: 0.85rem; }
    .sug-item:hover { background: #2a2a2a; }
    .sug-code { color: #888; margin-left: 8px; }
    #results { display: none; }
    .station-header { margin-bottom: 20px; }
    .station-name { font-size: 1.4rem; color: #fff; }
    .station-kanji { font-size: 1.1rem; color: #888; margin-top: 2px;
                     font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; }
    .station-code { font-size: 0.85rem; color: #666; margin-top: 4px; }
    .section { margin-bottom: 20px; }
    .section-title { font-size: 0.7rem; color: #666; letter-spacing: 0.1em;
                     text-transform: uppercase; margin-bottom: 10px;
                     border-bottom: 1px solid #222; padding-bottom: 6px; }

    /* ─ Badge pill (suburban / IZX / AX) — colore testo via JS */
    .line-chip {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      margin: 3px;
      font-weight: bold;
    }

    /* ─ Badge cerchio (metro) — colore testo via JS */
    .line-chip-metro {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 0.75rem;
      margin: 3px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .interchange-row { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 4px;
                       padding: 12px 14px; margin-bottom: 8px; }
    .irow-top { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .irow-code { font-size: 1rem; color: #eee; }
    .irow-name { font-size: 0.85rem; color: #aaa; }
    .irow-kanji { font-size: 0.8rem; color: #666;
                  font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; }
    .irow-network { font-size: 0.7rem; color: #666; text-transform: uppercase;
                    background: #222; padding: 2px 6px; border-radius: 2px; }
    .irow-meta { font-size: 0.75rem; color: #555; margin-top: 4px; }
    .ok   { color: #4caf50; }
    .warn { color: #ff9800; }
    .err  { color: #f44336; }
    .status-row { display: flex; align-items: center; gap: 8px; margin-top: 6px;
                  font-size: 0.78rem; }
    .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .dot-ok   { background: #4caf50; }
    .dot-warn { background: #ff9800; }
    .dot-err  { background: #f44336; }
    #no-result { color: #666; font-size: 0.9rem; display: none; }
  </style>
</head>
<body>
  <h1>⚙ STATION INSPECTOR</h1>

  <div id="search-bar">
    <input id="query" type="text" placeholder="Search by name or code (e.g. M409, Kasakuri, LL01)…" autocomplete="off">
    <button onclick="inspect()">Inspect</button>
    <button onclick="coverage()">Coverage</button>
  </div>
  <div id="suggestions"></div>
  <div id="no-result">No station found.</div>
  <div id="results"></div>

  <!-- ═══ DATA FILES ══════════════════════════════════════════════════ -->
  <script src="metro/m1-data.js"></script>
  <script src="metro/m2-data.js"></script>
  <script src="metro/m3-data.js"></script>
  <script src="metro/m4-data.js"></script>
  <script src="metro/m5-data.js"></script>
  <script src="metro/m6-data.js"></script>
  <script src="metro/m7-data.js"></script>
  <script src="metro/m8-data.js"></script>
  <script src="metro/m9-data.js"></script>
  <script src="metro/m10-data.js"></script>
  <script src="metro/m11-data.js"></script>
  <script src="metro/m12-data.js"></script>
  <script src="metro/m13-data.js"></script>
  <script src="metro/m14-data.js"></script>
  <script src="metro/m15-data.js"></script>
  <script src="metro/m17-data.js"></script>
  <script src="metro/m20-data.js"></script>
  <script src="metro/hoy-data.js"></script>
  <script src="suburban-data.js"></script>
  <script src="ts-data.js"></script>
  <script src="ck-data.js"></script>
  <script src="other-rail-data/hd-data.js"></script>
  <script src="other-rail-data/wi-data.js"></script>
  <script src="other-rail-data/shx-data.js"></script>
  <script src="other-rail-data/ssk-data.js"></script>
  <script src="izx-data.js"></script>
  <script src="ax-data.js"></script>

  <script>
  /* ── WCAG relative luminance → auto contrast (#000 or #fff) ────────── */
  function hexToLinear(c) {
    const v = parseInt(c, 16) / 255;
    return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  }
  function luminance(hex) {
    hex = hex.replace(/^#/, '');
    if (hex.length === 3) hex = hex.split('').map(x => x + x).join('');
    const r = hexToLinear(hex.slice(0, 2));
    const g = hexToLinear(hex.slice(2, 4));
    const b = hexToLinear(hex.slice(4, 6));
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }
  function contrastColor(hex) {
    // soglia 0.35: sopra → testo nero, sotto → testo bianco
    return luminance(hex || '#888') > 0.35 ? '#000' : '#fff';
  }

  /* ── Build unified station index ────────────────────────────────────── */
  const ALL_STATIONS = [];

  function addMetroLine(ST, META) {
    if (typeof ST === 'undefined' || typeof META === 'undefined') return;
    for (const [code, st] of Object.entries(ST)) {
      ALL_STATIONS.push({ code, name: st.n, kanji: st.k || '', network: 'metro',
        lineId: META.id || META.code, lineColor: META.color, lineName: META.name });
    }
  }

  addMetroLine(typeof M1_ST  !== 'undefined' ? M1_ST  : undefined,
               typeof M1_META  !== 'undefined' ? M1_META  : undefined);
  addMetroLine(typeof M2_ST  !== 'undefined' ? M2_ST  : undefined,
               typeof M2_META  !== 'undefined' ? M2_META  : undefined);
  addMetroLine(typeof M3_ST  !== 'undefined' ? M3_ST  : undefined,
               typeof M3_META  !== 'undefined' ? M3_META  : undefined);
  addMetroLine(typeof M4_ST  !== 'undefined' ? M4_ST  : undefined,
               typeof M4_META  !== 'undefined' ? M4_META  : undefined);
  addMetroLine(typeof M5_ST  !== 'undefined' ? M5_ST  : undefined,
               typeof M5_META  !== 'undefined' ? M5_META  : undefined);
  addMetroLine(typeof M6_ST  !== 'undefined' ? M6_ST  : undefined,
               typeof M6_META  !== 'undefined' ? M6_META  : undefined);
  addMetroLine(typeof M7_ST  !== 'undefined' ? M7_ST  : undefined,
               typeof M7_META  !== 'undefined' ? M7_META  : undefined);
  addMetroLine(typeof M8_ST  !== 'undefined' ? M8_ST  : undefined,
               typeof M8_META  !== 'undefined' ? M8_META  : undefined);
  addMetroLine(typeof M9_ST  !== 'undefined' ? M9_ST  : undefined,
               typeof M9_META  !== 'undefined' ? M9_META  : undefined);
  addMetroLine(typeof M10_ST !== 'undefined' ? M10_ST : undefined,
             typeof M10_META !== 'undefined' ? M10_META : undefined);
  addMetroLine(typeof M11_ST !== 'undefined' ? M11_ST : undefined,
               typeof M11_META !== 'undefined' ? M11_META : undefined);
  addMetroLine(typeof M12_ST !== 'undefined' ? M12_ST : undefined,
               typeof M12_META !== 'undefined' ? M12_META : undefined);
  addMetroLine(typeof M13_ST !== 'undefined' ? M13_ST : undefined,
               typeof M13_META !== 'undefined' ? M13_META : undefined);
  addMetroLine(typeof M14_ST !== 'undefined' ? M14_ST : undefined,
               typeof M14_META !== 'undefined' ? M14_META : undefined);
  addMetroLine(typeof M15_ST !== 'undefined' ? M15_ST : undefined,
               typeof M15_META !== 'undefined' ? M15_META : undefined);
  addMetroLine(typeof M17_ST !== 'undefined' ? M17_ST : undefined,
               typeof M17_META !== 'undefined' ? M17_META : undefined);
  addMetroLine(typeof M20_ST !== 'undefined' ? M20_ST : undefined,
               typeof M20_META !== 'undefined' ? M20_META : undefined);
  addMetroLine(typeof HOY_ST !== 'undefined' ? HOY_ST : undefined,
               typeof HOY_META !== 'undefined' ? HOY_META : undefined);

  /* Suburban */
  if (typeof SUBURBAN_LINES !== 'undefined') {
    for (const line of Object.values(SUBURBAN_LINES)) {
      for (const st of line.stations) {
        if (ALL_STATIONS.find(s => s.code === st.code)) continue;
        ALL_STATIONS.push({ code: st.code, name: st.name, kanji: st.k || st.kanji || '',
          network: 'suburban', lineId: line.id, lineColor: line.color, lineName: line.name });
      }
    }
  }

  /* Linee con struttura "stations[]" (HD, WI, SHX) — non fuse in SUBURBAN_LINES */
  function addStationArrayLines(lines, network) {
    if (!lines) return;
    for (const line of Object.values(lines)) {
      for (const st of line.stations || []) {
        if (ALL_STATIONS.find(s => s.code === st.code && s.lineId === line.id)) continue;
        ALL_STATIONS.push({ code: st.code, name: st.name, kanji: st.k || st.kanji || '',
          network, lineId: line.id, lineColor: line.color, lineName: line.name });
      }
    }
  }
  addStationArrayLines(typeof HD_LINES  !== 'undefined' ? HD_LINES  : null, 'other');
  addStationArrayLines(typeof WI_LINES  !== 'undefined' ? WI_LINES  : null, 'other');
  addStationArrayLines(typeof SHX_LINES !== 'undefined' ? SHX_LINES : null, 'other');
  addStationArrayLines(typeof SSK_LINES !== 'undefined' ? SSK_LINES : null, 'other');
    
  /* TS (AI + tronco + tratto KW condiviso) */
  (function () {
    const groups = [typeof TS_AI_STATIONS   !== 'undefined' ? TS_AI_STATIONS   : [],
                    typeof TS_MAIN_STATIONS !== 'undefined' ? TS_MAIN_STATIONS : [],
                    typeof TS_KW_STATIONS   !== 'undefined' ? TS_KW_STATIONS   : []];
    for (const arr of groups) for (const st of arr) {
      const base = { name: st.name, kanji: st.kanji && st.kanji !== '—' ? st.kanji : '',
        network: 'suburban', lineId: 'TS', lineColor: '#F5EE27', lineName: 'Tandan-Senpyan' };
      if (!ALL_STATIONS.find(s => s.code === st.code && s.lineId === 'TS'))
        ALL_STATIONS.push({ code: st.code, ...base });
      if (st.kwAlias && !ALL_STATIONS.find(s => s.code === st.kwAlias && s.lineId === 'TS'))
        ALL_STATIONS.push({ code: st.kwAlias, ...base });
    }
  })();

  /* CK */
  if (typeof CK_ST !== 'undefined') {
    const ck = (typeof CK_SERVICES !== 'undefined' && CK_SERVICES[0]) || {};
    for (const [code, st] of Object.entries(CK_ST)) {
      ALL_STATIONS.push({ code, name: st.n, kanji: st.k || '', network: 'suburban',
        lineId: 'CK', lineColor: ck.color || '#6B9E3E', lineName: ck.name || 'Chukkūn Line' });
    }
  }

  /* IZX */
  if (typeof IZX_LINES !== 'undefined') {
    for (const [lineId, line] of Object.entries(IZX_LINES)) {
      for (const [code, st] of Object.entries(line.ST || {})) {
        if (ALL_STATIONS.find(s => s.code === code)) continue;
        ALL_STATIONS.push({ code, name: st.n || code, kanji: st.k || '',
          network: 'izx', lineId, lineColor: line.META?.color || '#888', lineName: line.META?.name || lineId });
      }
    }
  }

  /* AX */
  if (typeof AX_LINES !== 'undefined') {
    for (const [lineId, line] of Object.entries(AX_LINES)) {
      for (const [code, st] of Object.entries(line.ST || {})) {
        if (ALL_STATIONS.find(s => s.code === code)) continue;
        ALL_STATIONS.push({ code, name: st.n || code, kanji: st.k || '',
          network: 'ax', lineId, lineColor: line.META?.color || '#888', lineName: line.META?.name || lineId });
      }
    }
  }

  /* ── Kanji helper ──────────────────────────────────────────── */
  function kanjiSpan(k, cls = 'irow-kanji') {
    return k ? ` <span class="${cls}">${k}</span>` : '';
  }

  /* ── Badge con colore testo automatico ────────────────────────── */
  function lineBadge(lineId, lineColor, lineName, network) {
    const col = lineColor || '#888';
    const txt = contrastColor(col);
    if (network === 'metro') {
      return `<span class="line-chip-metro" style="background:${col};color:${txt}">${lineId}</span>`
           + `<span style="font-size:0.8rem;color:#888;margin-right:12px">${lineName}</span>`;
    }
    return `<span class="line-chip" style="background:${col};color:${txt}">${lineId}</span>`
         + `<span style="font-size:0.8rem;color:#888;margin-right:12px">${lineName}</span>`;
  }

  /* ── Autocomplete ─────────────────────────────────────────── */
  const qEl   = document.getElementById('query');
  const sugEl = document.getElementById('suggestions');

  qEl.addEventListener('input', () => {
    const q = qEl.value.trim().toLowerCase();
    sugEl.innerHTML = '';
    if (q.length < 2) { sugEl.style.display = 'none'; return; }

    const rawHits = ALL_STATIONS.filter(s =>
      s.code.toLowerCase().includes(q) ||
      s.name.toLowerCase().includes(q) ||
      (s.kanji && s.kanji.includes(q))
    );

    const grouped = [];
    const seenNames = new Set();
    for (const s of rawHits) {
      const key = s.name.toLowerCase();
      if (seenNames.has(key)) continue;
      seenNames.add(key);
      const peers = rawHits.filter(x => x.name.toLowerCase() === key);
      grouped.push({ name: s.name, kanji: s.kanji, codes: peers });
    }

    if (!grouped.length) { sugEl.style.display = 'none'; return; }

    grouped.slice(0, 12).forEach(g => {
      const div = document.createElement('div');
      div.className = 'sug-item';
      const codeList = g.codes.map(s => `${s.code} · ${s.lineId}`).join('  ');
      const kanjiPart = g.kanji
        ? ` <span style="color:#666;font-family:sans-serif">${g.kanji}</span>` : '';
      div.innerHTML = `${g.name}${kanjiPart} <span class="sug-code">${codeList}</span>`;
      div.onclick = () => { qEl.value = g.codes[0].code; sugEl.style.display = 'none'; inspect(); };
      sugEl.appendChild(div);
    });
    sugEl.style.display = 'block';
  });

  document.addEventListener('click', e => {
    if (!sugEl.contains(e.target) && e.target !== qEl) sugEl.style.display = 'none';
  });
  qEl.addEventListener('keydown', e => { if (e.key === 'Enter') inspect(); });

  /* ── Interchange map ──────────────────────────────────────────── */
  const METRO_INTERCHANGE_MAP = {};
  [
    ['M1',  typeof M1_INTERCHANGE  !== 'undefined' ? M1_INTERCHANGE  : null],
    ['M2',  typeof M2_INTERCHANGE  !== 'undefined' ? M2_INTERCHANGE  : null],
    ['M3',  typeof M3_INTERCHANGE  !== 'undefined' ? M3_INTERCHANGE  : null],
    ['M4',  typeof M4_INTERCHANGE  !== 'undefined' ? M4_INTERCHANGE  : null],
    ['M5',  typeof M5_INTERCHANGE  !== 'undefined' ? M5_INTERCHANGE  : null],
    ['M6',  typeof M6_INTERCHANGE  !== 'undefined' ? M6_INTERCHANGE  : null],
    ['M7',  typeof M7_INTERCHANGE  !== 'undefined' ? M7_INTERCHANGE  : null],
    ['M8',  typeof M8_INTERCHANGE  !== 'undefined' ? M8_INTERCHANGE  : null],
    ['M9',  typeof M9_INTERCHANGE  !== 'undefined' ? M9_INTERCHANGE  : null],
    ['M10', typeof M9_INTERCHANGE  !== 'undefined' ? M9_INTERCHANGE  : null],
    ['M11', typeof M11_INTERCHANGE !== 'undefined' ? M11_INTERCHANGE : null],
    ['M12', typeof M12_INTERCHANGE !== 'undefined' ? M12_INTERCHANGE : null],
    ['M13', typeof M13_INTERCHANGE !== 'undefined' ? M13_INTERCHANGE : null],
    ['M14', typeof M14_INTERCHANGE !== 'undefined' ? M14_INTERCHANGE : null],
    ['M15', typeof M15_INTERCHANGE !== 'undefined' ? M15_INTERCHANGE : null],
    ['M17', typeof M17_INTERCHANGE !== 'undefined' ? M17_INTERCHANGE : null],
    ['M20', typeof M20_INTERCHANGE !== 'undefined' ? M20_INTERCHANGE : null],
    ['HOY', typeof HOY_INTERCHANGE !== 'undefined' ? HOY_INTERCHANGE : null],
  ].forEach(([id, obj]) => { if (obj) METRO_INTERCHANGE_MAP[id] = obj; });

  /* ── Interscambi "flat" (key → [codici]) di tutte le reti non-metro ── */
  const FLAT_IX_SOURCES = [
    ['SUBURBAN', typeof SUBURBAN_INTERCHANGE   !== 'undefined' ? SUBURBAN_INTERCHANGE   : null],
    ['TS',       typeof TS_INTERCHANGE         !== 'undefined' ? TS_INTERCHANGE         : null],
    ['CK',       typeof CK_INTERCHANGE_ADDENDA !== 'undefined' ? CK_INTERCHANGE_ADDENDA : null],
    ['HD',       typeof HD_INTERCHANGE         !== 'undefined' ? HD_INTERCHANGE         : null],
    ['WI',       typeof WI_INTERCHANGE         !== 'undefined' ? WI_INTERCHANGE         : null],
    ['SHX',      typeof SHX_INTERCHANGE        !== 'undefined' ? SHX_INTERCHANGE        : null],
    ['SSK',      typeof SSK_INTERCHANGE        !== 'undefined' ? SSK_INTERCHANGE : null],
  ];
  const FLAT_IX = [];
  (function () {
    const seen = new Set();
    for (const [src, map] of FLAT_IX_SOURCES) {
      if (!map) continue;
      for (const [from, partners] of Object.entries(map)) {
        for (const p of partners) {
          const to = (p && typeof p === 'object') ? p.code : p;
          if (typeof to !== 'string' || !to) continue;
          const key = [from, to].sort().join('<>');
          if (seen.has(key)) continue;
          seen.add(key);
          FLAT_IX.push({ from, to, src });
        }
      }
    }
  })();

  const KNOWN_CODES = new Set(ALL_STATIONS.map(s => s.code));
  function reach(code) { return KNOWN_CODES.has(code) ? 'ok' : 'missing'; }

  /* ── Coverage: codici referenziati negli interscambi ma assenti nei dati ── */
  function lineKeyOf(code) {
    const m = /^M(\d+)(\d{2})$/.exec(code);
    if (m) return 'M' + m[1];
    const p = /^[A-Za-z]+/.exec(code);
    return p ? p[0] : code;
  }
  function coverage() {
    sugEl.style.display = 'none';
    document.getElementById('no-result').style.display = 'none';
    const refs = {};   /* code → Set(sorgenti) */
    function ref(code, from) { (refs[code] = refs[code] || new Set()).add(from); }
    for (const [lineId, imap] of Object.entries(METRO_INTERCHANGE_MAP))
      for (const [mcode, entries] of Object.entries(imap))
        for (const e of (Array.isArray(entries) ? entries : [entries])) {
          ref(mcode, lineId); ref(e.code ?? e, mcode);
        }
    for (const ix of FLAT_IX) { ref(ix.from, ix.src); ref(ix.to, ix.from); }

    const missing = Object.keys(refs).filter(c => !KNOWN_CODES.has(c));
    const byLine = {};
    missing.forEach(c => (byLine[lineKeyOf(c)] = byLine[lineKeyOf(c)] || []).push(c));

    const loaded = {};
    ALL_STATIONS.forEach(s => { loaded[s.lineId] = (loaded[s.lineId] || 0) + 1; });

    let html = `<div class="section"><div class="section-title">Lines loaded (${Object.keys(loaded).length})</div>
      <div style="display:flex;flex-wrap:wrap;align-items:center">`;
    Object.keys(loaded).forEach(id => {
      const s = ALL_STATIONS.find(x => x.lineId === id);
      html += lineBadge(id, s.lineColor, loaded[id] + ' st.', s.network);
    });
    html += `</div></div>
      <div class="section"><div class="section-title">Referenced but missing (${missing.length} codes · ${Object.keys(byLine).length} lines)</div>`;
    if (!missing.length) html += `<span class="ok">None — every interchange partner exists in the data.</span>`;
    Object.keys(byLine).sort().forEach(k => {
      const codes = byLine[k].sort();
      html += `<div class="interchange-row">
        <div class="irow-top"><span class="dot dot-err"></span><span class="irow-code">${k}</span>
          <span class="irow-network">${codes.length} code${codes.length > 1 ? 's' : ''}</span></div>
        <div class="irow-meta">${codes.map(c => `${c} ← ${[...refs[c]].join(', ')}`).join(' · ')}</div>
      </div>`;
    });
    html += `</div>`;
    const resultsEl = document.getElementById('results');
    resultsEl.innerHTML = html;
    resultsEl.style.display = 'block';
  }

  /* ── Core inspect() ────────────────────────────────────────── */
  function inspect() {
    sugEl.style.display = 'none';
    const raw = qEl.value.trim();
    const q   = raw.toLowerCase();
    const resultsEl = document.getElementById('results');
    const noResult  = document.getElementById('no-result');

    const station = ALL_STATIONS.find(s =>
      s.code.toLowerCase() === q || s.name.toLowerCase() === q ||
      (s.kanji && s.kanji === raw)
    ) || ALL_STATIONS.find(s =>
      s.code.toLowerCase().includes(q) || s.name.toLowerCase().includes(q) ||
      (s.kanji && s.kanji.includes(q))
    );

    if (!station) {
      resultsEl.style.display = 'none';
      noResult.style.display  = 'block';
      return;
    }
    noResult.style.display = 'none';

    const memberOf = ALL_STATIONS.filter(s => s.code === station.code);

    /* Interscambi metro */
    const metroInterchanges = [];
    for (const [lineId, imap] of Object.entries(METRO_INTERCHANGE_MAP)) {
      for (const [mcode, entries] of Object.entries(imap)) {
        for (const entry of (Array.isArray(entries) ? entries : [entries])) {
          const pCode = entry.code ?? entry;
          if (pCode === station.code || mcode === station.code) {
            metroInterchanges.push({ lineId, metroCode: mcode, partnerCode: pCode,
              network: entry.network, transferMin: entry.transferMin, note: entry.note });
          }
        }
      }
    }

    /* Interscambi suburban */
    const subInterchanges = FLAT_IX.filter(ix => ix.from === station.code || ix.to === station.code);

    function renderInterchangeSection(title, items, getOtherCode, getNetwork, getNote, getTransferMin) {
      if (!items.length) return '';
      let html = `<div class="section"><div class="section-title">${title}</div>`;
      items.forEach(ix => {
        const otherCode = getOtherCode(ix);
        const otherNet  = getNetwork(ix);
        const st2    = ALL_STATIONS.find(s => s.code === otherCode);
        const status = otherNet === 'ibaches' ? 'ok' : reach(otherCode);
        const dotCls = status === 'ok' ? 'dot-ok' : status === 'missing' ? 'dot-err' : 'dot-warn';
        const txtCls = status === 'ok' ? 'ok'     : status === 'missing' ? 'err'     : 'warn';
        html += `
          <div class="interchange-row">
            <div class="irow-top">
              ${st2 ? lineBadge(st2.lineId, st2.lineColor, '', st2.network) : ''}
              <span class="irow-code">${otherCode}</span>
              <span class="irow-name">${st2?.name || '?'}</span>
              ${st2?.kanji ? kanjiSpan(st2.kanji) : ''}
              <span class="irow-network">${otherNet}</span>
            </div>
            <div class="irow-meta">${getNote(ix) || ''} · ${getTransferMin(ix) ?? '?'} min walk</div>
            <div class="status-row">
              <span class="dot ${dotCls}"></span>
              <span class="${txtCls}">${status === 'ok' ? 'Reachable in router' : status === 'missing' ? 'NOT FOUND in data' : 'Data unavailable'}</span>
            </div>
          </div>`;
      });
      return html + `</div>`;
    }

    let html = `
      <div class="station-header">
        <div class="station-name">${station.name}</div>
        ${station.kanji ? `<div class="station-kanji">${station.kanji}</div>` : ''}
        <div class="station-code">${station.code}</div>
      </div>
      <div class="section">
        <div class="section-title">Member of lines</div>
        <div style="display:flex;flex-wrap:wrap;align-items:center">
          ${memberOf.map(s => lineBadge(s.lineId, s.lineColor, s.lineName, s.network)).join('')}
        </div>
      </div>`;

    html += renderInterchangeSection(
      'Metro Interchanges', metroInterchanges,
      ix => ix.metroCode === station.code ? ix.partnerCode : ix.metroCode,
      ix => ix.metroCode === station.code ? ix.network     : 'metro',
      ix => ix.note, ix => ix.transferMin
    );

    if (subInterchanges.length) {
      html += `<div class="section"><div class="section-title">Suburban Interchanges</div>`;
      subInterchanges.forEach(ix => {
        const otherCode = ix.from === station.code ? ix.to : ix.from;
        const st2  = ALL_STATIONS.find(s => s.code === otherCode);
        const net2 = st2?.network || '?';
        const status = reach(otherCode);
        const dotCls = status === 'ok' ? 'dot-ok' : status === 'missing' ? 'dot-err' : 'dot-warn';
        const txtCls = status === 'ok' ? 'ok'     : status === 'missing' ? 'err'     : 'warn';
        html += `
          <div class="interchange-row">
            <div class="irow-top">
              ${st2 ? lineBadge(st2.lineId, st2.lineColor, '', st2.network) : ''}
              <span class="irow-code">${otherCode}</span>
              <span class="irow-name">${st2?.name || '?'}</span>
              ${st2?.kanji ? kanjiSpan(st2.kanji) : ''}
              <span class="irow-network">${net2}</span>
            </div>
            <div class="status-row">
              <span class="dot ${dotCls}"></span>
              <span class="${txtCls}">${status === 'ok' ? 'Reachable in router' : status === 'missing' ? 'NOT FOUND in data' : 'Data unavailable'}</span>
            </div>
          </div>`;
      });
      html += `</div>`;
    }

    if (!metroInterchanges.length && !subInterchanges.length) {
      html += `<div class="section"><div class="section-title">Interchanges</div>
        <span style="color:#555;font-size:0.85rem">No interchange defined for this station.</span></div>`;
    }

    resultsEl.innerHTML = html;
    resultsEl.style.display = 'block';
  }
  </script>
</body>
</html>
